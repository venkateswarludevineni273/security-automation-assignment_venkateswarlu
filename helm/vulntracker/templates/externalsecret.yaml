apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "vulntracker.name" . }}-signing-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.secretStoreRef.kind }}
    name: {{ .Values.secrets.secretStoreRef.name }}
  target:
    name: {{ include "vulntracker.name" . }}-signing-key
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: {{ .Values.secrets.signingKey.remoteKey | quote }}
        {{- with .Values.secrets.signingKey.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- if .Values.notify.enabled }}
    - secretKey: notify-token
      remoteRef:
        key: {{ .Values.notify.tokenRemoteKey | quote }}
    {{- end }}
